<section id="__SECTION_ID__" class="ra-section" aria-labelledby="__SECTION_ID__-title">
  <div class="ra-heading ra-copy"><h3 id="__SECTION_ID__-title">走到哪裡了。</h3></div>
  <div class="ra-prose ra-copy"><p>每一站固定標一個狀態詞。狀態靠文字分辨，顏色只是輔助。</p></div>
  <figure class="ra-figure">
    <ol class="ra-road">
      <li class="is-done"><span class="ra-when">第 1 週</span><h4>整理需求</h4><span class="badge badge-primary">已完成</span><p>需求清單定稿</p></li>
      <li><span class="ra-when">第 2 週</span><h4>製作候選</h4><span class="badge badge-outline badge-primary">進行中</span><p>正在做</p></li>
      <li class="is-plan"><span class="ra-when">第 3 週</span><h4>審查</h4><span class="badge ra-st-plan">規劃中</span><p>決定要做、還沒動</p></li>
      <li class="is-open"><span class="ra-when">未定</span><h4>擴充</h4><span class="badge ra-st-open">待決</span><p>還沒決定做不做</p></li>
    </ol>
    <p class="ra-legend ra-copy" aria-label="狀態詞說明"><span><span class="badge badge-primary">已完成</span>做完、已在用</span><span><span class="badge badge-outline badge-primary">進行中</span>正在做</span><span><span class="badge ra-st-plan">規劃中</span>決定要做、還沒動</span><span><span class="badge ra-st-open">待決</span>還沒決定做不做</span></p>
    <figcaption class="ra-copy">日期或階段用 span.ra-when，不用 time：站台會改 Claude 文章裡 time 的顏色。</figcaption>
  </figure>
</section>
