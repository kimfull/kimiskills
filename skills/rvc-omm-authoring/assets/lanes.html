<section id="__SECTION_ID__" class="ra-section" aria-labelledby="__SECTION_ID__-title">
  <div class="ra-heading ra-copy"><h3 id="__SECTION_ID__-title">誰做哪一步，做完交給誰。</h3></div>
  <div class="ra-prose ra-copy"><p>一個角色一條道，步驟照順序往右走；每一步寫交給誰、交什麼。</p></div>
  <figure class="ra-figure">
    <ol class="ra-chain ra-lanes" style="--steps:4">
      <li class="ra-lane-name" style="--r:1" aria-hidden="true">需求方</li>
      <li class="ra-lane-name" style="--r:2" aria-hidden="true">製作方</li>
      <li class="ra-lane-name" style="--r:3" aria-hidden="true">審查方</li>
      <li class="ra-lstep" style="--r:1;--c:1"><span class="ra-no" aria-hidden="true">1</span><span class="ra-who">需求方</span><h4>提出需求</h4><p class="ra-hand">→ 製作方：<wbr>需求清單</p></li>
      <li class="ra-lstep" style="--r:2;--c:2"><span class="ra-no" aria-hidden="true">2</span><span class="ra-who">製作方</span><h4>製作候選</h4><p class="ra-hand">→ 審查方：<wbr>候選版本</p></li>
      <li class="ra-lstep" style="--r:3;--c:3"><span class="ra-no" aria-hidden="true">3</span><span class="ra-who">審查方</span><h4>審查</h4><p class="ra-hand">→ 製作方：<wbr>修正清單</p></li>
      <li class="ra-lstep" style="--r:2;--c:4"><span class="ra-no" aria-hidden="true">4</span><span class="ra-who">製作方</span><h4>修正交付</h4><p class="ra-hand">→ 需求方：<wbr>完成版本</p></li>
    </ol>
    <figcaption class="ra-copy">ol 的 --steps 寫總步數；每步 --r 是第幾道、--c 是第幾步。角色名最多約 5 個字。</figcaption>
  </figure>
</section>
